<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1f2328;
    --muted: #59636e;
    --border: #d1d9e0;
    --accent: #0969da;
    --warn: #cf222e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --fg: #e6edf3;
      --muted: #9198a1;
      --border: #3d444d;
      --accent: #4493f8;
      --warn: #f85149;
    }
  }
  body {
    margin: 0 auto;
    padding: 24px 16px 64px;
    max-width: 720px;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif;
    line-height: 1.8;
  }
  h1 { font-size: 1.5rem; margin: 0 0 16px; }
  h2 { font-size: 1.15rem; margin: 32px 0 8px; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
  #timer {
    position: sticky;
    top: 0;
    margin: 0 0 16px;
    padding: 12px 16px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  #timer .label { color: var(--muted); font-size: 0.85rem; }
  #timer .clock { font-size: 2rem; font-variant-numeric: tabular-nums; font-weight: 600; }
  #timer.running .clock { color: var(--accent); }
  #timer.over .clock { color: var(--warn); }
  code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
</style>
</head>
<body>

<div id="timer" data-start="__START__" data-end="__END__">
  <div class="label" id="timer-label"></div>
  <div class="clock" id="timer-clock">--:--:--</div>
</div>

<h1>__TITLE__</h1>

<h2>概要</h2>
<p>__SUMMARY__</p>

<h2>仕様</h2>
__SPEC__

<h2>制約</h2>
<ul>
  <li>制限時間は1時間。終わらなくてもよい。時間になったら、そこまでの状態を質問係に見せる。</li>
  <li>言語、フレームワーク、DBは自由。選んだ根拠は、あとで聞かれる。</li>
</ul>

<script>
(function () {
  var box = document.getElementById("timer");
  var label = document.getElementById("timer-label");
  var clock = document.getElementById("timer-clock");
  var start = Date.parse(box.dataset.start);
  var end = Date.parse(box.dataset.end);

  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function fmt(ms) {
    var s = Math.max(0, Math.floor(ms / 1000));
    return pad(Math.floor(s / 3600)) + ":" + pad(Math.floor((s % 3600) / 60)) + ":" + pad(s % 60);
  }

  function tick() {
    var now = Date.now();
    box.className = "";
    if (now < start) {
      label.textContent = "開始まで";
      clock.textContent = fmt(start - now);
    } else if (now < end) {
      box.className = "running";
      label.textContent = "残り時間";
      clock.textContent = fmt(end - now);
    } else {
      box.className = "over";
      label.textContent = "時間切れ。そこまでの状態を質問係に見せる";
      clock.textContent = "00:00:00";
    }
  }

  tick();
  setInterval(tick, 1000);
})();
</script>

<!--
採点用の情報。解く前にソースを開かないこと。
採点skill(grade)が、この一覧を読んで採点する。

クリティカルなエラー:
- __CRITICAL_1__

軽微なエラー:
- __MINOR_1__

質問するケース:
- __QUESTION_1__
-->

</body>
</html>
