<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>coding-drill</title>
<style>
  :root { --bg: #ffffff; --fg: #1f2328; --muted: #59636e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; }
  }
  body {
    margin: 0 auto;
    padding: 24px 16px;
    max-width: 720px;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif;
    line-height: 1.8;
  }
  p { color: var(--muted); }
</style>
</head>
<body>
<h1>coding-drill</h1>
<p>週1回、1時間で解く実装課題の練習用ページ。問題文は、出題のたびに <code>/&lt;日曜の日付&gt;_&lt;題材&gt;/</code> に追加される。</p>
</body>
</html>
