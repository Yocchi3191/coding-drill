<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>coding-drill</title>
<style>
  :root { --bg: #ffffff; --fg: #1f2328; --muted: #59636e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; }
  }
  body {
    margin: 0 auto;
    padding: 24px 16px;
    max-width: 720px;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif;
    line-height: 1.8;
  }
  p { color: var(--muted); }
  h2 { font-size: 1.15rem; margin: 32px 0 8px; }
  a { color: #4493f8; }
  @media (prefers-color-scheme: light) { a { color: #0969da; } }
</style>
</head>
<body>
<h1>coding-drill</h1>
<p>週1回、1時間で解く実装課題の練習用ページ。問題文は、出題のたびに追加される。</p>

<h2>課題一覧</h2>
<ul id="list">
<!-- 出題タスクが、新しい課題を、この行の下に追加する（新しい順）。形式: <li><a href="<日曜の日付>_<題材>/"><日曜の日付> <題名></a></li> -->
</ul>
</body>
</html>
